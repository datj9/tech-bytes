name: Preview (Build Check)

on:
  pull_request:
    branches: [master]

jobs:
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pipeline deps
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff anthropic

      - name: Ruff
        working-directory: pipeline
        run: ruff check .

      - name: Pytest
        working-directory: pipeline
        run: python -m pytest -q

  infra-validate:
    runs-on: ubuntu-latest
    # CDK synth is best-effort: the infra path is optional and Route53 hosted-zone
    # lookup needs real AWS creds + the user's domain. TypeScript compile (above)
    # already catches most code errors; synth failures here don't block the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TypeScript compile
        working-directory: infra
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

      - name: CDK synth (best-effort — needs Route53 creds for hosted-zone lookup)
        working-directory: infra
        run: |
          pnpm exec cdk synth --quiet \
            --context domain.name=synth.example.com \
            --context hosted.zone.name=example.com \
            --context github.repo=${{ github.repository }} || \
          echo "Synth skipped (Route53 lookup needs real AWS creds — OK for PR CI)."
