name: Deploy (AWS)

# Optional advanced path — requires AWS CDK + a Route53-managed domain.
# Configure infra/cdk.json context (or pass -c flags) for your domain/repo/region.
# Secrets (set in repo Settings → Secrets):
#   AWS_ROLE_ARN  — the OIDC role from a prior `cdk deploy` output (GitHubActionsRoleArn)
#
# This workflow only runs on push to the default branch OR manual dispatch.
# The free path lives in digest.yml.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download latest data from S3
        run: |
          STACK_NAME="${{ vars.CDK_STACK_NAME || 'TechBytesStack' }}"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          mkdir -p data
          aws s3 sync "s3://${BUCKET}/data/" data/ --exclude "archive/*" || true
          aws s3 sync "s3://${BUCKET}/data/archive/" data/archive/ || true

      - name: Install and build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install infra and deploy
        working-directory: infra
        run: |
          pnpm install --frozen-lockfile
          pnpm exec cdk deploy --require-approval never \
            --context domain.name=${{ vars.CDK_DOMAIN_NAME }} \
            --context hosted.zone.name=${{ vars.CDK_HOSTED_ZONE_NAME }} \
            --context github.repo=${{ github.repository }}
